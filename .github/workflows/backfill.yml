name: backfill

# 과거 항목 한국어 백필. 수집은 하지 않고 이미 저장된 행의 번역·상세만 소급 생성한다.
#
# 항목당 LLM 호출이 2~3회라 한 번에 다 돌리면 비용과 시간이 크다. limit으로 나눠
# 여러 번 실행하는 것을 전제로 하며, 처리한 행은 backfilled_at이 찍혀 재실행해도
# 다시 과금되지 않는다(최신 날짜부터 처리).
on:
  workflow_dispatch:
    inputs:
      limit:
        description: '이번 실행에서 처리할 건수'
        type: choice
        options: ['10', '20', '30', '50', '100']
        default: '30'
      dry:
        description: '대상만 출력하고 쓰지 않음'
        type: boolean
        default: false
      retry_empty:
        description: '이전에 결과가 비었거나 일부만 생성된 행을 다시 대상으로'
        type: boolean
        default: false

permissions:
  contents: write          # 갱신된 DB를 커밋

# daily.yml과 DB를 공유하므로 같은 큐에 둔다(동시 실행 시 푸시가 충돌한다)
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # 토큰을 .git/config에 남기지 않는다. 뒤 스텝들이 외부 패키지로 신뢰할 수 없는
      # RSS·HTML을 처리하므로, 그 코드가 저장소 쓰기 토큰을 읽을 수 없게 한다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      # 운영 의존성 중 설치 스크립트가 필요한 패키지는 없다. 스크립트 실행 경로를 막아둔다.
      - run: npm ci --ignore-scripts

      - name: Backfill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          # 입력은 셸에 직접 끼워넣지 않고 환경변수로 넘긴다
          LIMIT: ${{ inputs.limit }}
          DRY: ${{ inputs.dry }}
          RETRY: ${{ inputs.retry_empty }}
        run: |
          args="--limit=$LIMIT"
          [ "$DRY" = "true" ] && args="$args --dry"
          [ "$RETRY" = "true" ] && args="$args --retry-empty"
          npm run backfill -- $args

      # 백필이 중간에 죽어도 그때까지 DB에 쓴 건 살린다. 항목당 LLM 호출이 2~3회라
      # 한 배치를 통째로 버리면 그만큼 다시 과금된다.
      - name: Commit database
        if: ${{ !inputs.dry && !cancelled() }}
        env:
          # checkout이 토큰을 남기지 않으므로(persist-credentials: false) 푸시할 때만 쓴다
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f daily-digest.db
          git diff --staged --quiet || git commit -m "chore: backfill $(date -u +%Y-%m-%d)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
